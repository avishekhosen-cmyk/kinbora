<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Kinbora Business mobile management app" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>Kinbora Business</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}button{font:inherit}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;background:#111827;color:white;padding:16px 18px 14px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;opacity:.7;margin-top:2px}.content{padding:18px}.greeting{font-size:14px;color:#6b7280}.title{font-size:25px;font-weight:800;margin:4px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border-radius:18px;padding:16px;box-shadow:0 4px 18px #1118270a;border:1px solid #e9edf3}.label{font-size:12px;color:#6b7280}.value{font-size:23px;font-weight:800;margin-top:5px}.section{margin-top:22px;font-size:17px;font-weight:800;margin-bottom:10px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}.muted{color:#6b7280;font-size:12px}.pill{padding:6px 9px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;display:flex;justify-content:center;z-index:10}.navin{width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:white;padding:10px 4px 11px;color:#6b7280;font-size:11px}.nav button.active{color:#111827;font-weight:800}.icon{font-size:20px;display:block;margin-bottom:3px}.install{position:fixed;left:16px;right:16px;bottom:75px;background:#111827;color:white;border:0;border-radius:14px;padding:13px;font-weight:700;display:none;z-index:9}.empty{padding:28px 10px;text-align:center;color:#6b7280}.search{width:100%;padding:13px;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:12px;outline:none}.list{background:white;border-radius:16px;padding:4px 16px}.back{border:0;background:none;color:white;padding:0;margin-right:10px;font-size:18px}
  </style>
</head>
<body>
<div id="root"></div>
<button id="install" class="install">Install Kinbora Business</button>
<script>
const state={page:'dashboard',installed:false,products:[['Wireless Headphones','€39.99',24],['Kitchen Blender','€59.00',8],['Smart Watch','€79.99',3]],orders:[['#KB-1042','Maria Silva','€129.90','Processing'],['#KB-1041','João Costa','€59.00','Shipped'],['#KB-1040','Ana Santos','€79.99','Delivered']]};
const root=document.getElementById('root'); const install=document.getElementById('install'); let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='block'}); install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;install.style.display='none'}};
function nav(){return `<nav class="nav"><div class="navin">${[['dashboard','⌂','Home'],['orders','🛒','Orders'],['products','📦','Products'],['more','☰','More']].map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="icon">${x[1]}</span>${x[2]}</button>`).join('')}</div></nav>`}
function shell(body){root.innerHTML=`<div class="app"><header class="top"><div class="brand">Kinbora Business</div><div class="sub">Business management</div></header><main class="content">${body}</main>${nav()}</div>`}
function dashboard(){shell(`<div class="greeting">Good morning</div><div class="title">Business overview</div><div class="grid"><div class="card"><div class="label">Today's sales</div><div class="value">€268.89</div></div><div class="card"><div class="label">Orders today</div><div class="value">8</div></div><div class="card"><div class="label">Customers</div><div class="value">1,284</div></div><div class="card"><div class="label">Low stock</div><div class="value">6</div></div></div><div class="section">Recent orders</div><div class="list">${state.orders.map(o=>`<div class="row"><div><b>${o[0]}</b><div class="muted">${o[1]} · ${o[2]}</div></div><span class="pill">${o[3]}</span></div>`).join('')}</div><div class="section">Quick actions</div><div class="grid"><button class="card" onclick="go('products')">➕ Add product</button><button class="card" onclick="go('orders')">📋 View orders</button><button class="card" onclick="go('products')">▣ Inventory</button><button class="card" onclick="go('more')">📊 Reports</button></div>`)}
function orders(){shell(`<div class="title">Orders</div><input class="search" placeholder="Search order or customer" oninput="filterOrders(this.value)"><div id="orderList" class="list">${orderRows(state.orders)}</div>`)}
function orderRows(rows){return rows.map(o=>`<div class="row"><div><b>${o[0]}</b><div class="muted">${o[1]} · ${o[2]}</div></div><span class="pill">${o[3]}</span></div>`).join('')||'<div class="empty">No orders found</div>'}
function filterOrders(q){const x=q.toLowerCase();document.getElementById('orderList').innerHTML=orderRows(state.orders.filter(o=>o.join(' ').toLowerCase().includes(x)))}
function products(){shell(`<div class="title">Products</div><input class="search" placeholder="Search products" oninput="filterProducts(this.value)"><div id="productList" class="list">${productRows(state.products)}</div>`)}
function productRows(rows){return rows.map(p=>`<div class="row"><div><b>${p[0]}</b><div class="muted">${p[1]} · Stock ${p[2]}</div></div><span class="pill">${p[2]<5?'Low stock':'In stock'}</span></div>`).join('')||'<div class="empty">No products found</div>'}
function filterProducts(q){const x=q.toLowerCase();document.getElementById('productList').innerHTML=productRows(state.products.filter(p=>p.join(' ').toLowerCase().includes(x)))}
function more(){shell(`<div class="title">Business tools</div><div class="list">${[['📊','Reports'],['🏷️','Coupons & marketing'],['↩️','Returns & refunds'],['🚚','Shipping'],['👥','Customers'],['🏭','Suppliers & purchases'],['💶','Expenses & profit'],['⭐','Reviews'],['🔔','Notifications'],['🛡️','Staff & permissions'],['⚙️','Settings']].map(x=>`<div class="row"><div><span style="margin-right:10px">${x[0]}</span>${x[1]}</div><span class="muted">›</span></div>`).join('')}</div><div class="section">Connection</div><div class="card"><b>Kinbora store</b><div class="muted" style="margin-top:5px">Ready for secure WooCommerce/API connection</div></div>`)}
function go(p){state.page=p;p==='dashboard'?dashboard():p==='orders'?orders():p==='products'?products():more()} dashboard();
</script>
</body></html>
