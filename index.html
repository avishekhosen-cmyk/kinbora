<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kinbora POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#cceaf0,#f7ceda);color:#172235;overflow:hidden}.shell{max-width:1500px;margin:auto;padding:24px}.app{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 48px);max-height:920px;background:#edf5fb;border-radius:26px;overflow:hidden;box-shadow:0 28px 70px rgba(20,33,55,.22);animation:appIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes appIn{from{opacity:0;transform:scale(.96) translateY(18px)}to{opacity:1;transform:none}}@keyframes slideIn{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(52,124,246,.08)}}@keyframes float{50%{transform:translateY(-3px)}}@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sidebar{background:#17253a;color:#fff;padding:25px 14px}.brand{height:72px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin:-25px -14px 26px;padding:0 28px;animation:slideIn .55s .1s both}.logo{font-size:28px;animation:float 2.4s ease-in-out infinite}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;color:#dce5f0;text-align:left;padding:14px 15px;border-radius:16px;font-size:15px;display:flex;align-items:center;gap:13px;cursor:pointer;transition:transform .2s,background .25s,color .25s,box-shadow .25s}.nav button:hover{background:#243651;color:#fff;transform:translateX(5px)}.nav button.active{background:#f7fafc;color:#152238;box-shadow:0 8px 20px rgba(0,0,0,.08);animation:pulse 2.4s infinite}.ico{width:20px;text-align:center;transition:transform .25s}.nav button:hover .ico{transform:scale(1.18) rotate(-5deg)}.nav button span:last-child{margin-left:auto}
.main{padding:22px 24px;display:grid;grid-template-rows:auto auto 1fr;min-width:0}.top{display:flex;align-items:center;gap:14px;animation:fadeUp .55s .15s both}.search{flex:1;height:46px;border-radius:18px;border:1px solid #e7edf4;background:#fff;padding:0 18px;color:#333;outline:none;transition:box-shadow .25s,transform .25s,border-color .25s}.search:focus{border-color:#5794f5;box-shadow:0 0 0 4px rgba(87,148,245,.12);transform:translateY(-1px)}.top button{height:46px;border-radius:23px;border:1px solid #dce5ef;background:#fff;padding:0 16px;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s}.top button:hover{transform:translateY(-2px);box-shadow:0 7px 18px rgba(36,62,94,.12)}.top button:active{transform:scale(.94)}.sale{background:#347cf6!important;color:#fff;border-color:#347cf6!important;font-weight:700;animation:pulse 3s infinite}.user{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 6px!important}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#687a8e,#e8c4aa);display:inline-flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:800;transition:transform .3s}.user:hover .avatar{transform:rotate(8deg) scale(1.08)}
.tabs{display:flex;align-items:center;gap:24px;padding:20px 10px 12px;color:#39495e;font-size:14px;animation:fadeUp .55s .25s both}.tabs span{cursor:pointer;position:relative;transition:color .2s,transform .2s}.tabs span:hover{color:#3278ec;transform:translateY(-1px)}.tabs .active{color:#3278ec;font-weight:700}.tabs .active:after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:2px;background:#3278ec;border-radius:2px;animation:pop .35s both}
.content{display:grid;grid-template-columns:1fr 300px;gap:18px;min-height:0;animation:fadeUp .6s .3s both}.catalog{background:#f7fbff;border-radius:24px;padding:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e6edf5;border-radius:15px;padding:10px;box-shadow:0 4px 12px rgba(21,40,64,.05);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s;animation:fadeUp .5s both}.card:nth-child(1){animation-delay:.35s}.card:nth-child(2){animation-delay:.4s}.card:nth-child(3){animation-delay:.45s}.card:nth-child(4){animation-delay:.5s}.card:nth-child(5){animation-delay:.55s}.card:nth-child(6){animation-delay:.6s}.card:nth-child(7){animation-delay:.65s}.card:nth-child(8){animation-delay:.7s}.card:nth-child(9){animation-delay:.75s}.card:hover{transform:translateY(-6px) scale(1.015);box-shadow:0 15px 30px rgba(30,67,112,.14);border-color:#91baff}.card.selected{border-color:#3f8cff;box-shadow:0 0 0 1px rgba(63,140,255,.12)}.pic{height:102px;background:#eef5fb;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .4s}.card:hover .pic img{transform:scale(1.08);filter:saturate(1.08)}.badge{position:absolute;right:7px;top:7px;background:#ffd63d;border-radius:6px;padding:4px 6px;font-size:10px;font-weight:800;transition:transform .25s}.card:hover .badge{transform:rotate(-2deg) scale(1.06)}.name{font-weight:700;font-size:12px;line-height:1.2;margin-top:8px}.price{float:right;font-size:12px;font-weight:800;transition:color .2s}.card:hover .price{color:#2875eb}.add{width:calc(100% - 30px);height:26px;margin-top:8px;border:0;border-radius:14px;background:#dceaff;color:#213c67;font-size:10px;cursor:pointer;transition:transform .2s,background .25s,box-shadow .25s}.add:hover{background:#c8ddff;box-shadow:0 5px 12px rgba(50,120,236,.16);transform:translateY(-1px)}.add:active{transform:scale(.96)}.more{float:right;width:24px;height:24px;border-radius:50%;border:0;background:#e4efff;color:#3278ec;cursor:pointer;transition:transform .3s,background .2s}.more:hover{transform:rotate(90deg) scale(1.08);background:#cfe2ff}
.summary{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 14px rgba(30,55,90,.06);display:flex;flex-direction:column;animation:fadeUp .6s .42s both}.summary h3{font-size:15px;margin:4px 0 10px}.order-meta{background:#fff;border:1px solid #eef1f5;border-radius:16px;padding:12px;transition:box-shadow .25s,transform .25s}.order-meta:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(30,55,90,.08)}.small{font-size:11px;color:#8895a7}.pill{float:right;background:#fff1db;color:#d27c21;font-size:10px;padding:5px 8px;border-radius:9px;animation:pulse 2.8s infinite}.item{display:flex;align-items:center;gap:10px;border:1px solid #edf1f5;border-radius:14px;padding:9px;margin-top:10px;animation:pop .4s both;transition:transform .25s,box-shadow .25s,border-color .25s}.item:hover{transform:translateX(-3px);box-shadow:0 8px 18px rgba(30,55,90,.08);border-color:#bcd5f5}.thumb{width:56px;height:48px;border-radius:9px;background:#eaf2f9;object-fit:cover;transition:transform .3s}.item:hover .thumb{transform:scale(1.06)}.item-info{flex:1}.item-name{font-size:12px;font-weight:700}.item-price{font-size:12px;color:#2875eb;font-weight:800;margin-top:5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pay{height:34px;border-radius:18px;border:1px solid #d7e1ed;background:#fff;font-size:11px;cursor:pointer;transition:all .22s}.pay:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(40,90,150,.1)}.pay.active{background:#eef5ff;border-color:#5995f5;color:#3178e8;font-weight:700}.pay:active{transform:scale(.95)}.totals{margin-top:auto}.row{display:flex;justify-content:space-between;font-size:13px;margin-top:10px;transition:transform .2s}.row:hover{transform:translateX(-2px)}.row.total{font-size:15px;font-weight:800;border-top:1px dashed #dfe4e9;padding-top:14px}.footer-actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:14px}.footer-actions button{height:42px;border-radius:21px;border:1px solid #dbe4ec;background:#fff;color:#d07645;font-weight:700;cursor:pointer;transition:transform .22s,box-shadow .22s,background .22s}.footer-actions button:hover{transform:translateY(-2px);box-shadow:0 7px 15px rgba(30,55,90,.1)}.footer-actions button:active{transform:scale(.95)}.footer-actions .confirm{background:#4caf36;color:#fff;border-color:#4caf36;animation:pulse 3s infinite}.scroll{height:100%;overflow:auto;padding-right:4px}.toast{position:fixed;right:30px;bottom:28px;background:#17253a;color:#fff;padding:12px 18px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.2);font-size:13px;z-index:20;animation:toastIn .35s both}.toast.hide{animation:toastOut .3s both}@keyframes toastIn{from{opacity:0;transform:translateY(15px) scale(.95)}to{opacity:1;transform:none}}@keyframes toastOut{to{opacity:0;transform:translateY(15px)}}.fly{position:fixed;z-index:30;width:24px;height:24px;border-radius:50%;background:#347cf6;pointer-events:none;animation:fly .55s cubic-bezier(.4,0,.2,1) forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
@media(max-width:1000px){body{overflow:auto}.app{grid-template-columns:80px;min-height:900px}.brand{justify-content:center;padding:0;margin:-25px -14px 26px}.brand b{display:none}.nav button{justify-content:center}.nav button span:not(.ico){display:none}.content{grid-template-columns:1fr}.summary{min-height:480px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.shell{padding:8px}.app{grid-template-columns:1fr}.sidebar{display:none}.top{flex-wrap:wrap}.search{flex-basis:100%}.content{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.tabs{gap:12px;overflow:auto}.summary{display:flex}}
</style>
</head>
<body><div class="shell"><div class="app">
<aside class="sidebar"><div class="brand"><span class="logo">🌺</span><b>Kinbora</b></div><nav class="nav"><button class="active"><span class="ico">▦</span><span>Dashboard</span></button><button><span class="ico">▣</span><span>Sales</span><span>⌄</span></button><button><span class="ico">◫</span><span>Inventory</span><span>⌄</span></button><button><span class="ico">▤</span><span>Orders</span><span>⌄</span></button><button><span class="ico">♧</span><span>Customers</span><span>⌄</span></button><button><span class="ico">◉</span><span>Analytics</span></button><button><span class="ico">▱</span><span>Store</span><span>⌄</span></button></nav></aside>
<main class="main"><div class="top"><input id="search" class="search" aria-label="Search Product" placeholder="⌕  Search Product.."><button class="sale" id="newSale">⊕ &nbsp;New Sale</button><button id="print">▣</button><button id="settings">⚙</button><button class="user"><span class="avatar">JM</span><span>Jason Miller<br><small>Cashier</small></span>⌄</button></div>
<div class="tabs"><span class="active">All Items</span><span>Apparels⌄</span><span>Accessories⌄</span><span>Footwear⌄</span><span>Gifts⌄</span><span style="margin-left:auto">☷</span></div>
<div class="content"><section class="catalog"><div class="scroll"><div class="grid" id="grid"></div></div></section><aside class="summary"><h3>Order’s Summary <span style="float:right">↗</span></h3><div class="order-meta"><div class="small">Order No.: <b>A6-1023</b> <span class="pill">In Progress</span></div></div><div style="font-size:12px;font-weight:700;margin-top:16px">Total Items <span id="count">(2)</span></div><div id="cart"></div><div class="actions"><button class="pay active">▣ QR</button><button class="pay">▱ Cash</button><button class="pay">▢ Wallet</button></div><div class="totals"><div class="row"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="row" style="color:#8793a1"><span>Discount</span><span>$0</span></div><div class="row" style="color:#8793a1"><span>VAT (10%)</span><span id="vat">$0.00</span></div><div class="row total"><span>Total</span><span id="total">$0.00</span></div><div class="footer-actions"><button id="cancel">Cancel</button><button id="phone">Phone<br>Number</button><button class="confirm" id="confirm">Confirm<br>Order</button></div></div></aside></div></main></div></div>
<script>
const products=[['Urban Edge Tee','$28.9','75','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80'],['CrystalEdge Midi Skirt','$38','27','https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=500&q=80'],['Indigo Fade Denim','$42.5','68','https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=500&q=80'],['FrostWave Bomber Jacket','$87','14','https://images.unsplash.com/photo-1520975958225-5d1f9b3b56f4?auto=format&fit=crop&w=500&q=80'],['Classic Aura Polo (set of 3)','$28','55','https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=500&q=80'],['Radiant Flare Mini Skirt','$40','37','https://images.unsplash.com/photo-1583496661160-fb5886a13d27?auto=format&fit=crop&w=500&q=80'],['Noir Classic Chinos (set of 3)','$42','21','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=500&q=80'],['Straight Sequin Dress','$85','09','https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=500&q=80'],['Leather Jacket','$92','18','https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=500&q=80']];
const grid=document.getElementById('grid'),cart=document.getElementById('cart');let selected=[0,2];
function money(v){return '$'+v.toFixed(2)}
function render(){grid.innerHTML=products.map((p,i)=>`<article class="card ${selected.includes(i)?'selected':''}"><div class="pic"><img src="${p[3]}" alt="${p[0]}"><span class="badge">${p[2]} Left</span></div><div class="name">${p[0]} <span class="price">${p[1]}</span></div><button class="add" data-add="${i}">+ Add to Cart</button><button class="more" aria-label="More">☷</button></article>`).join('');cart.innerHTML=selected.map((i,k)=>`<div class="item" style="animation-delay:${k*.08}s"><img class="thumb" src="${products[i][3]}" alt=""><div class="item-info"><div class="item-name">${products[i][0]}</div><div class="small">XL | Navy Blue</div><div class="item-price">${products[i][1]}</div></div><span>✎</span><span>♧</span></div>`).join('');let s=selected.reduce((n,i)=>n+parseFloat(products[i][1].replace('$','')),0);document.getElementById('subtotal').textContent=money(s);document.getElementById('vat').textContent=money(s*.1);document.getElementById('total').textContent=money(s*1.1);document.getElementById('count').textContent='('+selected.length+')';document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>add(+b.dataset.add)))}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.classList.add('hide');setTimeout(()=>t.remove(),300)},1800)}
function add(i){if(!selected.includes(i)){selected.push(i);render();toast(products[i][0]+' added to cart');const b=document.querySelector(`[data-add="${i}"]`);const f=document.createElement('span');f.className='fly';const r=b.getBoundingClientRect();const c=document.querySelector('.summary').getBoundingClientRect();f.style.left=r.left+r.width/2+'px';f.style.top=r.top+'px';f.style.setProperty('--dx',(c.left-r.left)+'px');f.style.setProperty('--dy',(c.top-r.top)+'px');document.body.appendChild(f);setTimeout(()=>f.remove(),600)}}
render();
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.card').forEach(c=>c.style.display=c.querySelector('.name').textContent.toLowerCase().includes(q)?'':'none')});
document.querySelectorAll('.pay').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast(b.textContent.trim()+' payment selected')}));
document.getElementById('newSale').addEventListener('click',()=>{selected=[];render();toast('New sale started')});document.getElementById('confirm').addEventListener('click',()=>toast('✓ Order confirmed successfully'));document.getElementById('cancel').addEventListener('click',()=>{selected=[];render();toast('Order cancelled')});document.getElementById('phone').addEventListener('click',()=>toast('Phone number requested'));document.getElementById('print').addEventListener('click',()=>toast('Receipt preview opened'));document.getElementById('settings').addEventListener('click',()=>toast('Settings panel opened'));
document.querySelectorAll('.tabs span').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tabs span').forEach(x=>x.classList.remove('active'));t.classList.add('active');toast(t.textContent.replace('⌄','').trim()+' selected')}));
</script></body></html>
