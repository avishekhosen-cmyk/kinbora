<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kinbora POS Dashboard</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#cceaf0,#f7ceda);color:#172235}button,input{font:inherit} .shell{max-width:1500px;margin:0 auto;padding:24px}.app{display:grid;grid-template-columns:190px 1fr;min-height:820px;background:#edf5fb;border-radius:26px;overflow:hidden;box-shadow:0 28px 70px rgba(20,33,55,.22)}
    .sidebar{background:#17253a;color:#fff;padding:25px 14px}.brand{height:72px;background:#17253a;border-bottom-right-radius:28px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin:-25px -14px 26px;padding:0 28px}.logo{font-size:28px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;color:#dce5f0;text-align:left;padding:14px 15px;border-radius:16px;font-size:15px;display:flex;align-items:center;gap:13px;cursor:pointer}.nav button.active{background:#f7fafc;color:#152238}.nav button span:last-child{margin-left:auto;font-size:15px}.ico{width:20px;text-align:center}
    .main{padding:22px 24px;display:grid;grid-template-rows:auto auto 1fr}.top{display:flex;align-items:center;gap:14px}.search{flex:1;height:46px;border-radius:18px;border:1px solid #e7edf4;background:#fff;padding:0 18px;color:#333;outline:none}.top button{height:46px;border-radius:23px;border:1px solid #dce5ef;background:#fff;padding:0 16px;cursor:pointer}.sale{background:#347cf6!important;color:#fff;border-color:#347cf6!important;font-weight:700}.user{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 6px!important}.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#687a8e,#e8c4aa);display:inline-flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:800}
    .tabs{display:flex;align-items:center;gap:24px;padding:20px 10px 12px;color:#39495e;font-size:14px}.tabs .active{color:#3278ec;font-weight:700}.content{display:grid;grid-template-columns:1fr 300px;gap:18px;min-height:0}.catalog{background:#f7fbff;border-radius:24px;padding:14px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid #e6edf5;border-radius:15px;padding:10px;box-shadow:0 4px 12px rgba(21,40,64,.05)}.card.selected{border-color:#3f8cff;box-shadow:0 0 0 1px rgba(63,140,255,.12)}.pic{height:102px;background:#eef5fb;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:7px;top:7px;background:#ffd63d;border-radius:6px;padding:4px 6px;font-size:10px;font-weight:800}.name{font-weight:700;font-size:12px;line-height:1.2;margin-top:8px}.price{float:right;font-size:12px;font-weight:800}.add{width:calc(100% - 30px);height:26px;margin-top:8px;border:0;border-radius:14px;background:#dceaff;color:#213c67;font-size:10px;cursor:pointer}.more{float:right;width:24px;height:24px;border-radius:50%;border:0;background:#e4efff;color:#3278ec;cursor:pointer}.summary{background:#fff;border-radius:24px;padding:16px;box-shadow:0 4px 14px rgba(30,55,90,.06);display:flex;flex-direction:column}.summary h3{font-size:15px;margin:4px 0 10px}.order-meta{background:#fff;border:1px solid #eef1f5;border-radius:16px;padding:12px}.small{font-size:11px;color:#8895a7}.pill{float:right;background:#fff1db;color:#d27c21;font-size:10px;padding:5px 8px;border-radius:9px}.line{border-top:1px dashed #ddd;margin:14px 0}.item{display:flex;align-items:center;gap:10px;border:1px solid #edf1f5;border-radius:14px;padding:9px;margin-top:10px}.thumb{width:56px;height:48px;border-radius:9px;background:#eaf2f9;object-fit:cover}.item-info{flex:1}.item-name{font-size:12px;font-weight:700}.item-price{font-size:12px;color:#2875eb;font-weight:800;margin-top:5px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.pay{height:34px;border-radius:18px;border:1px solid #d7e1ed;background:#fff;font-size:11px;cursor:pointer}.pay.active{background:#eef5ff;border-color:#5995f5;color:#3178e8;font-weight:700}.totals{margin-top:auto}.row{display:flex;justify-content:space-between;font-size:13px;margin-top:10px}.row.total{font-size:15px;font-weight:800;border-top:1px dashed #dfe4e9;padding-top:14px}.footer-actions{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin-top:14px}.footer-actions button{height:42px;border-radius:21px;border:1px solid #dbe4ec;background:#fff;color:#d07645;font-weight:700;cursor:pointer}.footer-actions .confirm{background:#4caf36;color:#fff;border-color:#4caf36}.scroll{height:100%;overflow:auto;padding-right:4px}
    @media(max-width:1000px){.app{grid-template-columns:80px}.brand{justify-content:center;padding:0;margin:-25px -14px 26px}.brand b{display:none}.nav button{justify-content:center}.nav button span:not(.ico){display:none}.content{grid-template-columns:1fr}.summary{min-height:480px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="shell"><div class="app">
<aside class="sidebar"><div class="brand"><span class="logo">🌺</span><b>Kinbora</b></div><nav class="nav">
<button class="active"><span class="ico">▦</span><span>Dashboard</span></button><button><span class="ico">▣</span><span>Sales</span><span>⌄</span></button><button><span class="ico">◫</span><span>Inventory</span><span>⌄</span></button><button><span class="ico">▤</span><span>Orders</span><span>⌄</span></button><button><span class="ico">♧</span><span>Customers</span><span>⌄</span></button><button><span class="ico">◉</span><span>Analytics</span></button><button><span class="ico">▱</span><span>Store</span><span>⌄</span></button>
</nav></aside>
<main class="main">
<div class="top"><input class="search" placeholder="⌕  Search Product.."/><button class="sale">⊕ &nbsp;New Sale</button><button>▣</button><button>⚙</button><button class="user"><span class="avatar">JM</span><span>Jason Miller<br><small>Cashier</small></span>⌄</button></div>
<div class="tabs"><span>All Items</span><span class="active">Apparels⌄</span><span>Accessories⌄</span><span>Footwear⌄</span><span>Gifts⌄</span><span style="margin-left:auto">☷</span></div>
<div class="content"><section class="catalog"><div class="scroll"><div class="grid" id="grid"></div></div></section><aside class="summary"><h3>Order’s Summary <span style="float:right">↗</span></h3><div class="order-meta"><div class="small">Order No.: <b>A6-1023</b> <span class="pill">In Progress</span></div></div><div style="font-size:12px;font-weight:700;margin-top:16px">Total Items <span>(8)</span></div><div id="cart"></div><div class="actions"><button class="pay active">▣ QR</button><button class="pay">▱ Cash</button><button class="pay">▢ Wallet</button></div><div class="totals"><div class="row"><span>Subtotal</span><b id="subtotal">$0.00</b></div><div class="row" style="color:#8793a1"><span>Discount</span><span>$0</span></div><div class="row" style="color:#8793a1"><span>VAT (10%)</span><span id="vat">$0.00</span></div><div class="row total"><span>Total</span><span id="total">$0.00</span></div><div class="footer-actions"><button>Cancel</button><button>Phone<br>Number</button><button class="confirm" id="confirm">Confirm<br>Order</button></div></div></aside></div>
</main></div></div>
<script>
const products=[
 ['Urban Edge Tee','$28.9','75','https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80'],
 ['CrystalEdge Midi Skirt','$38','27','https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=500&q=80'],
 ['Indigo Fade Denim','$42.5','68','https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=500&q=80'],
 ['FrostWave Bomber Jacket','$87','14','https://images.unsplash.com/photo-1520975958225-5d1f9b3b56f4?auto=format&fit=crop&w=500&q=80'],
 ['Classic Aura Polo (set of 3)','$28','55','https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=500&q=80'],
 ['Radiant Flare Mini Skirt','$40','37','https://images.unsplash.com/photo-1583496661160-fb5886a13d27?auto=format&fit=crop&w=500&q=80'],
 ['Noir Classic Chinos (set of 3)','$42','21','https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=500&q=80'],
 ['Straight Sequin Dress','$85','09','https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=500&q=80'],
 ['Leather Jacket','$92','18','https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=500&q=80']
];
const grid=document.getElementById('grid'),cart=document.getElementById('cart');let selected=[0,2];
function render(){grid.innerHTML=products.map((p,i)=>`<article class="card ${selected.includes(i)?'selected':''}"><div class="pic"><img src="${p[3]}" alt=""><span class="badge">${p[2]} Left</span></div><div class="name">${p[0]} <span class="price">${p[1]}</span></div><button class="add" onclick="add(${i})">+ Add to Cart</button><button class="more">☷</button></article>`).join('');cart.innerHTML=selected.map(i=>`<div class="item"><img class="thumb" src="${products[i][3]}"><div class="item-info"><div class="item-name">${products[i][0]}</div><div class="small">XL | Navy Blue</div><div class="item-price">${products[i][1]}</div></div><span>✎</span><span>♧</span></div>`).join('');let s=selected.reduce((n,i)=>n+parseFloat(products[i][1].replace('$','')),0);document.getElementById('subtotal').textContent='$'+s.toFixed(2);document.getElementById('vat').textContent='$'+(s*.1).toFixed(2);document.getElementById('total').textContent='$'+(s*1.1).toFixed(2)}
function add(i){if(!selected.includes(i))selected.push(i);render()}render();
document.getElementById('confirm').onclick=()=>alert('Order confirmed');
</script></body></html>
