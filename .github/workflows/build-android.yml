name: Build Kinbora Android APK

on:
  push:
    branches: [main, build-apk]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package.json
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Build release APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Locate APK
        working-directory: mobile-app
        run: |
          APK=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          cp "$APK" kinbora-business-release.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kinbora-business-android-release
          path: mobile-app/kinbora-business-release.apk
          if-no-files-found: error
          retention-days: 30
